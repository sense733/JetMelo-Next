name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 启用 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 准备签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::缺少 secret RELEASE_KEYSTORE_BASE64，拒绝以 debug 密钥产出发布包"
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"

      - name: 构建 release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: 校验产物未使用 debug 签名
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "${APK}"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)"
          "${APKSIGNER}" verify --print-certs "${APK}" | tee "${RUNNER_TEMP}/certs.txt"
          if grep -q "Android Debug" "${RUNNER_TEMP}/certs.txt"; then
            echo "::error::产物由 debug 密钥签名，已中止发布"
            exit 1
          fi

      - name: 生成分发文件与校验和
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/JetMelo-Next-${TAG}.apk"
          (cd dist && sha256sum "JetMelo-Next-${TAG}.apk" > "JetMelo-Next-${TAG}.apk.sha256")

      - name: 归档 mapping.txt 供崩溃回溯
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            ### 安装
            下载下方 APK 直接安装，首次安装需在系统中允许「安装未知来源应用」。
            可通过 `sha256sum` 或 `certutil -hashfile <文件> SHA256` 核对随附的 `.sha256` 校验和。

            ### 反馈
            如遇崩溃或异常，请提交 Issue 并附上机型、Android 版本与复现步骤，堆栈信息越完整定位越快。
            本版本为预发布版，请勿用于主力机。

            ### 免责
            本项目与网易云音乐及其关联公司无任何关系，仅供学习交流，不提供任何 VIP 内容解锁能力。
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE=""
          case "${TAG}" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "${TAG}" \
            "dist/JetMelo-Next-${TAG}.apk" \
            "dist/JetMelo-Next-${TAG}.apk.sha256" \
            --title "JetMelo-Next ${TAG}" \
            --generate-notes \
            ${PRERELEASE}
          CHANGELOG="$(gh release view "${TAG}" --json body --jq .body)"
          gh release edit "${TAG}" --notes "${NOTES}"$'\n\n'"${CHANGELOG}"
          echo "::notice::Release 已创建，请补充「已知问题」与「暂不支持场景」后再对外说明"
